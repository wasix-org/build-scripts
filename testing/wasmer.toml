[package]
name = "lorentz/build-scripts"
version = "0.1.10"
entrypoint = "server"

[dependencies]
"python/python" = "=3.13.1"

[fs]
"/app" = "./src"
"/tests" = "../tests"
"/opt/venv/packages" = "./wasix-site-packages"

[[command]]
name = "server"
module = "python/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/app/main.py"]
env = ["PYTHONEXECUTABLE=/bin/python", "PYTHONHOME=/cpython", "PYTHONPATH=/opt/venv/packages", "HOME=/app"]

[[command]]
name = "test"
module = "python/python:python"
runner = "wasi"

[command.annotations.wasi]
main-args = ["/app/run-tests.py"]
env = ["PYTHONEXECUTABLE=/bin/python", "PYTHONHOME=/cpython", "PYTHONPATH=/opt/venv/packages", "HOME=/app"]
